<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 09 - Timeline</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #1f2937;
      }
      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 0 20px;
      }
      .timeline {
        position: relative;
        margin-left: 20px;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #cbd5e1;
      }
      .event {
        position: relative;
        margin: 0 0 25px 35px;
        background: white;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 20px rgba(15,23,42,0.04);
      }
      .event::before {
        content: "";
        position: absolute;
        left: -28px;
        top: 20px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #3b82f6;
        border: 4px solid #f8fafc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Project timeline</h1>
      <div class="timeline">
        <div class="event">
          <h3>Discovery</h3>
          <p>Research, interviews, and requirements mapping.</p>
        </div>
        <div class="event">
          <h3>Prototype</h3>
          <p>Wireframes and user feedback loops.</p>
        </div>
        <div class="event">
          <h3>Build</h3>
          <p>Production UI and integration work.</p>
        </div>
        <div class="event">
          <h3>Launch</h3>
          <p>Release, monitoring, and iteration.</p>
        </div>
      </div>
    </div>
  </body>
</html>
