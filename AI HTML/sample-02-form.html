<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 02 - Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .form-box {
        background: white;
        width: min(420px, 90vw);
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(79,70,229,0.15);
      }
      h2 {
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        font-weight: bold;
      }
      input, textarea, select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 1rem;
      }
      button {
        margin-top: 18px;
        width: 100%;
        background: #4f46e5;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="form-box">
      <h2>Contact Us</h2>
      <form>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name" />

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" />

        <label for="topic">Topic</label>
        <select id="topic">
          <option>General Inquiry</option>
          <option>Sales</option>
          <option>Support</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Tell us more..."></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </body>
</html>
