<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 19 - Footer</title>
    <style>
      body { margin:0; font-family:Arial,sans-serif; background:#111827; color:#f9fafb; }
      footer { max-width:1100px; margin:0 auto; padding:60px 20px 40px; }
      .links { display:flex; justify-content:space-between; gap:20px; margin-bottom:20px; }
      .bottom { border-top:1px solid #374151; padding-top:20px; display:flex; justify-content:space-between; }
    </style>
  </head>
  <body>
    <footer>
      <div class="links">
        <div>
          <h3>Northstar</h3>
          <p>Simple digital products for modern teams.</p>
        </div>
        <div>
          <h4>Company</h4>
          <p>About</p>
          <p>Careers</p>
          <p>Contact</p>
        </div>
        <div>
          <h4>Resources</h4>
          <p>Blog</p>
          <p>Docs</p>
          <p>Help</p>
        </div>
      </div>
      <div class="bottom">
        <span>© 2026 Northstar</span>
        <span>Privacy • Terms</span>
      </div>
    </footer>
  </body>
</html>
