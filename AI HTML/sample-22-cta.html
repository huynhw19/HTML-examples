<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 22 - CTA</title>
    <style>
      body { margin:0; font-family:Arial,sans-serif; background:#0b1120; color:white; }
      .wrap { min-height:100vh; display:grid; place-items:center; }
      .panel { max-width:800px; text-align:center; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:52px 30px; }
      button { background:#f8fafc; color:#0f172a; border:none; padding:14px 22px; border-radius:10px; font-weight:bold; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <p>Ready to build something stronger?</p>
        <h1>Launch your next great idea with confidence.</h1>
        <button>Book a free consult</button>
      </div>
    </div>
  </body>
</html>
