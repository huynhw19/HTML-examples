<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 11 - Gallery</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 50px 20px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .item {
        height: 260px;
        border-radius: 18px;
        background: linear-gradient(135deg, #f59e0b, #ec4899);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Photo gallery</h1>
      <div class="gallery">
        <div class="item"></div>
        <div class="item" style="background: linear-gradient(135deg, #22c55e, #06b6d4);"></div>
        <div class="item" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6);"></div>
        <div class="item" style="background: linear-gradient(135deg, #f97316, #ef4444);"></div>
        <div class="item" style="background: linear-gradient(135deg, #14b8a6, #0ea5e9);"></div>
        <div class="item" style="background: linear-gradient(135deg, #a78bfa, #f9a8d4);"></div>
      </div>
    </div>
  </body>
</html>
