<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 20 - Checkout</title>
    <style>
      body { margin:0; font-family:Arial,sans-serif; background:#eef2ff; }
      .page { max-width:1000px; margin:60px auto; display:grid; grid-template-columns:1.2fr .8fr; gap:24px; }
      .panel { background:white; border-radius:20px; padding:28px; box-shadow:0 18px 30px rgba(79,70,229,0.08); }
      .summary { background:#111827; color:white; }
      .row { display:flex; justify-content:space-between; margin:12px 0; }
      input { width:100%; padding:12px 14px; margin:8px 0 14px; border:1px solid #cbd5e1; border-radius:10px; box-sizing:border-box; }
      button { width:100%; background:#4f46e5; color:white; border:none; padding:14px; border-radius:12px; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <h2>Checkout</h2>
        <label>Email</label>
        <input type="email" placeholder="you@example.com" />
        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456" />
        <label>Name on Card</label>
        <input type="text" placeholder="Your name" />
        <button>Pay $78</button>
      </div>
      <div class="panel summary">
        <h3>Order summary</h3>
        <div class="row"><span>Starter</span><span>$39</span></div>
        <div class="row"><span>Service fee</span><span>$9</span></div>
        <div class="row"><span>Tax</span><span>$30</span></div>
        <div class="row"><strong>Total</strong><strong>$78</strong></div>
      </div>
    </div>
  </body>
</html>
