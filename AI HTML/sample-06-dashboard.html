<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample 06 - Dashboard</title>
    <style>
      body {
        margin: 0;
        background: #e2e8f0;
        font-family: Arial, sans-serif;
        color: #0f172a;
      }
      .app {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      aside {
        background: #0f172a;
        color: white;
        padding: 28px 20px;
      }
      main {
        padding: 30px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      .stat {
        background: white;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      }
      .panel {
        background: white;
        border-radius: 18px;
        padding: 22px;
        min-height: 220px;
      }
      .grid-two {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <h2>Dash</h2>
        <p>Overview</p>
        <p>Reports</p>
        <p>Customers</p>
        <p>Settings</p>
      </aside>
      <main>
        <h1>Overview</h1>

        <div class="stats">
          <div class="stat">
            <div>Revenue</div>
            <h2>$48.2K</h2>
          </div>
          <div class="stat">
            <div>Users</div>
            <h2>12.4K</h2>
          </div>
          <div class="stat">
            <div>Orders</div>
            <h2>1,250</h2>
          </div>
          <div class="stat">
            <div>Conversion</div>
            <h2>6.8%</h2>
          </div>
        </div>

        <div class="grid-two">
          <div class="panel">
            <h3>Traffic</h3>
            <div style="height: 160px; background: linear-gradient(180deg, #dbeafe, #bfdbfe); border-radius: 12px;"></div>
          </div>
          <div class="panel">
            <h3>Top Channels</h3>
            <ul>
              <li>Organic search 42%</li>
              <li>Referral 31%</li>
              <li>Social 18%</li>
              <li>Email 9%</li>
            </ul>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
